name: build-skill

on:
  push:
    paths:
      - 'log-pulse/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-skill.yml'
      - '.gitignore'
      - 'README.md'
  pull_request:
    paths:
      - 'log-pulse/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-skill.yml'
      - '.gitignore'
      - 'README.md'
  workflow_dispatch:
  release:
    types: [created]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run tests
        run: pytest -q
      - name: Validate skill
        run: python scripts/quick_validate.py log-pulse

  package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Package skill
        run: python scripts/package_skill.py log-pulse dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: log-pulse-skill
          path: dist/log-pulse.skill
      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/log-pulse.skill
